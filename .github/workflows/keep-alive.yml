name: Keep Backend Awake

# Render free tier spins down after 15 min of inactivity.
# We ping every 5 min to leave a wide safety margin for GitHub Actions
# scheduler delays (which can be 10-20+ min under load).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -euo pipefail

          if [ -z "${BACKEND_URL:-}" ]; then
            echo "::error::BACKEND_URL secret is not set. Add it in repo Settings → Secrets → Actions (e.g. https://your-app.onrender.com)."
            exit 1
          fi

          base="${BACKEND_URL%/}"
          if echo "$base" | grep -qiE '/api$'; then
            echo "::error::BACKEND_URL must be the service root, not end with /api. Use e.g. https://your-app.onrender.com"
            exit 1
          fi

          health_url="${base}/api/health"
          echo "Base URL: $base"
          echo "Health URL: $health_url"

          ping_health() {
            local label="$1"
            local max_time="$2"
            local retries="$3"
            local retry_delay="$4"

            echo "--- $label ---"
            local code
            code=$(curl -sS -L -o /tmp/body -w "%{http_code}" \
              --max-time "$max_time" \
              --retry "$retries" \
              --retry-delay "$retry_delay" \
              --retry-all-errors \
              "$health_url" 2>/tmp/curl_err || true)

            if [ -z "$code" ] || [ "$code" = "000" ]; then
              code="000"
            fi

            echo "HTTP $code"
            if [ -s /tmp/curl_err ]; then
              echo "curl stderr:"
              cat /tmp/curl_err
            fi
            if [ -s /tmp/body ]; then
              echo "body:"
              head -c 500 /tmp/body
              echo
            fi

            [ "$code" = "200" ]
          }

          # Wake Render (first request often returns 502/503 while the dyno boots).
          echo "--- warmup (service root) ---"
          curl -sS -L -o /dev/null --max-time 45 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            "$base/" || true

          if ping_health "health check" 90 5 10; then
            echo "Backend is awake."
            exit 0
          fi

          echo "First health check failed — waiting 90s for Render cold-start"
          sleep 90

          if ping_health "recovery health check" 120 6 15; then
            echo "Backend recovered after cold-start."
            exit 0
          fi

          if grep -qi "service suspended" /tmp/body 2>/dev/null; then
            echo "::error::Render reports this service is SUSPENDED. Open the Render dashboard and resume or redeploy the service — keep-alive cannot fix a suspended instance."
          else
            echo "::error::Backend did not return HTTP 200 from $health_url. Check Render logs, redeploy, and that BACKEND_URL matches the live service URL."
          fi
          exit 1
